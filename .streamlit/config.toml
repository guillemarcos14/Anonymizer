# Local visual adaptation: attached split light/dark reference.
[theme]
base = "dark"
primaryColor = "#3665f3"
backgroundColor = "#1c1c1b"
secondaryBackgroundColor = "#272726"
textColor = "#ffffff"
borderColor = "#3d3d39"
codeBackgroundColor = "#272726"
font = "Inter, sans-serif"
headingFont = "Inter, sans-serif"
codeFont = "Inter, sans-serif"

[browser]
gatherUsageStats = false

[server]
address = "127.0.0.1"
port = 8502
headless = true
disconnectedSessionTTL = 0
enableStaticServing = false

[client]
showErrorDetails = "none"
